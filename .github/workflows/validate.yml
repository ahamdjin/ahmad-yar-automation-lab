name: Validate automation library

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate n8n workflow exports
        run: npm run validate

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python toolkit
        run: python -m compileall -q python

      - name: Test Python toolkit
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s tests/python -p 'test_*.py'

      - name: Install Python toolkit from source
        run: python -m pip install -e .

      - name: Smoke-test installed Python CLIs
        run: |
          gpt-action-audit python/examples/action-openapi.json
          gpt-chunk python/examples/knowledge.md -o /tmp/chunks.jsonl --max-chars 500 --overlap-chars 50
          gpt-compact python/examples/tool-output.json -o /tmp/compact.json --max-items 3 --max-string 100
          printf 'Email demo@example.com from 192.0.2.10' | gpt-redact --report > /tmp/redacted.txt
          grep -q '\[EMAIL_1\]' /tmp/redacted.txt
          gpt-url-check https://example.com/path
          gpt-retry 429 --method GET --attempt 1
          gpt-html-text python/examples/page.html --base-url https://example.com --json > /tmp/page.json
          gpt-dedupe-jsonl python/examples/retrieval-duplicates.jsonl -o /tmp/deduped.jsonl --report

      - name: Build and verify Python distributions
        run: |
          python -m pip install build twine
          rm -rf build dist
          python -m build
          python -m twine check dist/*

      - name: Verify wheel in a clean virtual environment
        run: |
          python -m venv /tmp/ahmad-yar-gpt-tools-wheel
          /tmp/ahmad-yar-gpt-tools-wheel/bin/python -m pip install dist/*.whl
          /tmp/ahmad-yar-gpt-tools-wheel/bin/python -c "import gpt_tools; print(gpt_tools.__version__)"
          /tmp/ahmad-yar-gpt-tools-wheel/bin/gpt-url-check https://example.com/
