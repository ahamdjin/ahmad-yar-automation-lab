name: Workflow or utility bug
description: Report a reproducible issue with a workflow, Python utility, or repository tool.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - n8n workflow
        - Python GPT / agent utility
        - validation tooling
        - documentation
        - reusable JavaScript snippet
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Workflow or file path
      placeholder: python/gpt_tools/tool_output_compactor.py
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Remove credentials, personal data, and private URLs before posting.
    validations:
      required: true
