[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ahmad-yar-gpt-tools"
version = "0.3.1"
description = "Dependency-light Python utilities for GPT, agent, retrieval, and tool pipelines."
readme = "python/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Ahmad Yar"}]
maintainers = [{name = "Ahmad Yar"}]
keywords = [
  "gpt",
  "agents",
  "automation",
  "retrieval",
  "openapi",
  "tool-calling",
  "ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://www.ahmadyar.co/"
Source = "https://github.com/ahamdjin/ahmad-yar-automation-lab"
Issues = "https://github.com/ahamdjin/ahmad-yar-automation-lab/issues"
Documentation = "https://github.com/ahamdjin/ahmad-yar-automation-lab/tree/main/python"
Changelog = "https://github.com/ahamdjin/ahmad-yar-automation-lab/releases"

[project.optional-dependencies]
yaml = ["PyYAML>=6,<7"]

[project.scripts]
gpt-chunk = "gpt_tools.retrieval_chunker:main"
gpt-redact = "gpt_tools.pii_redactor:main"
gpt-compact = "gpt_tools.tool_output_compactor:main"
gpt-action-audit = "gpt_tools.openapi_action_auditor:main"
gpt-url-check = "gpt_tools.url_safety_guard:main"
gpt-html-text = "gpt_tools.html_text_extractor:main"
gpt-retry = "gpt_tools.http_retry_policy:main"
gpt-dedupe-jsonl = "gpt_tools.jsonl_deduper:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
